name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  merge_group:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on:
      group: brainhive-nuc
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Configure bazel
        run: |
          echo "${{ secrets.BUILDBUDDY_BAZELRC }}" > .bazelrc.user &&
            echo "build --compilation_mode=opt" >> .bazelrc.user 
      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: docker context create builders || true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image [nginx]
        run: bazel run nginx:push -- -t latest -r ghcr.io/brainpodnl/distroless-php/nginx
      - name: Push image [php-fpm]
        run: bazel run php-fpm:push -- -t 8.3 -r ghcr.io/brainpodnl/distroless-php/php-fpm
