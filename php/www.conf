[global]
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data

access.log = /proc/self/fd/2

pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 25 
catch_workers_output = yes
clear_env = no